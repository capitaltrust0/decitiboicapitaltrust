# 1. BUILD SETTINGS
[build]
  publish = "/"
  functions = "netlify/functions"

# 2. REDIRECTS (The Order Matters!)
# First, route any call to /api directly to your function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Second, handle SPA routing (only for paths that aren't /api)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 3. GLOBAL HEADERS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # These static headers help, but the Function MUST still return its own headers
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# 4. FUNCTIONS SETTINGS
[functions]
  # This ensures your functions stay warm and use the latest Node environment
  node_bundler = "esbuild"
  external_node_modules = ["mongodb", "bcryptjs", "jsonwebtoken", "aws-sdk"]