    async function fetchCustomers() {
        const tableBody = document.getElementById('customerTableBody');
        tableBody.innerHTML = `
            <tr>
                <td colspan="5" class="p-10 text-center text-gray-400">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i> Syncing Database...
                </td>
            </tr>`;
        
        try {
            const token = sessionStorage.getItem('adminToken');
            if (!token) {
                window.location.href = 'admin_login.html';
                return;
            }

            const response = await fetch('/.netlify/functions/api', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({ action: 'get-all-customers' })
            });
            
            const data = await response.json();
            if (response.ok) {
                allCustomers = data.customers || [];
                renderTable(allCustomers);
            } else {
                throw new Error(data.message || "Failed to load");
            }
        } catch (err) {
            console.error("Fetch Error:", err);
            tableBody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-red-500">Connection Failed: ${err.message}</td></tr>`;
        }
    }

    function generateSwiftCode(userId) {
        const row = document.getElementById(`edit-row-${userId}`);
        const currency = row.querySelector('select[name="currency"]').value;
        const swiftInput = document.getElementById(`swift-${userId}`);
        
        const L = (n) => Array.from({length: n}, () => String.fromCharCode(65 + Math.floor(Math.random() * 26))).join('');
      let generatedSwift = "";
        switch(currency) {
            // North America & Central America
            case 'USD': generatedSwift = `${L(4)}US33898`; break;
            case 'CAD': generatedSwift = `${L(4)}CATT233`; break;
            case 'MXN': generatedSwift = `${L(4)}MXMM099`; break;
            case 'BZD': generatedSwift = `${L(4)}BZMM011`; break;
            case 'CRC': generatedSwift = `${L(4)}CRMM022`; break;
            case 'GTQ': generatedSwift = `${L(4)}GTMM033`; break;
            case 'HNL': generatedSwift = `${L(4)}HNMM044`; break;
            case 'NIO': generatedSwift = `${L(4)}NIMM055`; break;
            case 'PAB': generatedSwift = `${L(4)}PAMM066`; break;

            // Caribbean
            case 'BSD': generatedSwift = `${L(4)}BSMM011`; break;
            case 'BBD': generatedSwift = `${L(4)}BBMM022`; break;
            case 'CUP': generatedSwift = `${L(4)}CUMM033`; break;
            case 'DOP': generatedSwift = `${L(4)}DOMM044`; break;
            case 'HTG': generatedSwift = `${L(4)}HTMM055`; break;
            case 'JMD': generatedSwift = `${L(4)}JMMM066`; break;
            case 'TTD': generatedSwift = `${L(4)}TTMM077`; break;

            // South America
            case 'ARS': generatedSwift = `${L(4)}ARMM111`; break;
            case 'BOB': generatedSwift = `${L(4)}BOMM222`; break;
            case 'BRL': generatedSwift = `${L(4)}BRMM333`; break;
            case 'CLP': generatedSwift = `${L(4)}CLMM444`; break;

    function toggleInlineEdit(userId) {

    async function handleInlineSubmit(event, userId) {
        event.preventDefault();
        const form = event.target;
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        const originalBtnText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fa-solid fa-sync fa-spin"></i> Saving...';

        const formData = new FormData(form);
        const updateData = {
        firstName: formData.get('firstName'),
        lastName: formData.get('lastName'),
        email: formData.get('email'),
        password: formData.get('password'),
        phone: formData.get('phone'),
        dob: formData.get('dob'),
        gender: formData.get('gender'), // Added Gender
        loginPin: formData.get('loginPin'), // Added Login PIN
        transferPin: formData.get('transferPin'), // Added Transfer PIN
        profilePicUrl: formData.get('profilePicUrl'),
        currency: formData.get('currency'),
        status: formData.get('status'),
        routingNumber: formData.get('routingNumber'),
        swiftCode: formData.get('swiftCode'),
            accounts: {
                checking: {
                    accountName: '360 Checking',
                    accountNumber: formData.get('checkingAccNo'),
                    balance: parseFloat(formData.get('checkingBalance')) || 0
                },
                savings: {
                    accountName: '360 Savings',
                    accountNumber: formData.get('savingsAccNo'),
                    balance: parseFloat(formData.get('savingsBalance')) || 0
                }
            },
            address: {
                street: formData.get('street'),
                city: formData.get('city'),
                state: formData.get('state'),
                zip: formData.get('zip'),
                country: formData.get('country')
            },
            employment: {
                status: formData.get('empStatus'),
                income: formData.get('income')
            }
        };

        try {
            const response = await fetch('/.netlify/functions/api', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${sessionStorage.getItem('adminToken')}` 
                },
                body: JSON.stringify({ action: 'admin-update-user', userId, updateData })
            });

            if (response.ok) {
                toggleInlineEdit(userId); 
                await fetchCustomers();
            } else {
                const errData = await response.json();
                alert("Update failed: " + (errData.message || "Unknown error"));
            }
        } catch (err) {
            alert("Connection error occurred.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
        }
    }

    async function confirmDelete(userId, name) {
        if (confirm(`CRITICAL: Are you sure you want to permanently delete ${name}? This action cannot be undone.`)) {
            try {
                const response = await fetch('/.netlify/functions/api', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${sessionStorage.getItem('adminToken')}` 
                    },
                    body: JSON.stringify({ action: 'admin-delete-user', userId })
                });
                if (response.ok) {
                    alert("User successfully purged.");
                    await fetchCustomers();
                } else {
                    alert("Unauthorized or server error.");
                }
            } catch (err) { alert("Delete failed."); }
        }
    }

    function filterCustomers() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allCustomers.filter(c => 
            `${c.firstName} ${c.lastName}`.toLowerCase().includes(term) || 
            c.email.toLowerCase().includes(term) ||
            (c.address?.city && c.address.city.toLowerCase().includes(term))
        );
        renderTable(filtered);
    }

   // 3. The Generator Logic for Country-Specific Formats
function generateRoutingNumber(userId) {
    const row = document.getElementById(`edit-row-${userId}`);
    // Get the current selected currency from the dropdown
    const currency = row.querySelector('select[name="currency"]').value;
    const routingInput = document.getElementById(`routing-${userId}`);
    let generatedCode = "";
    
    // Helper to generate random numbers
    const rand = (n) => Math.floor(Math.pow(10, n-1) + Math.random() * (Math.pow(10, n) - Math.pow(10, n-1) - 1));

 switch(currency) {
        // North America & Central America
        case 'USD': 
            generatedCode = rand(9).toString(); // 9-digit Routing
            break;
        case 'CAD': 
            generatedCode = `${rand(5)}-${rand(3)}`; // Transit (5) - Inst (3)
            break;
        case 'MXN': 
            generatedCode = rand(18).toString(); // 18-digit CLABE
            break;
        case 'BZD': 
            generatedCode = rand(10).toString(); 
            break;
        case 'CRC': 
            generatedCode = "CR" + rand(18).toString(); // IBAN format for CR
            break;
        case 'GTQ': case 'HNL': case 'NIO': case 'PAB': 
            generatedCode = rand(10).toString(); 
            break;

        // Caribbean
        case 'BSD': case 'BBD': case 'JMD': case 'TTD': 
            generatedCode = `${rand(5)}-${rand(3)}`; 
            break;
        case 'CUP': case 'DOP': case 'HTG': 
            generatedCode = rand(12).toString(); 
            break;

        // South America
        case 'ARS': 
            generatedCode = rand(22).toString(); // CBU format
            break;
        case 'BRL': 
            generatedCode = rand(14).toString(); // Conta / ISPB
            break;
        case 'PEN': 
            generatedCode = rand(20).toString(); // CCI format
            break;
        case 'BOB': case 'CLP': case 'COP': case 'GYD': case 'PYG': case 'SRD': case 'UYU': case 'VES': 
            generatedCode = rand(12).toString(); 
            break;

        // UK & Europe
        case 'GBP': 
            generatedCode = `${rand(2)}-${rand(2)}-${rand(2)}`; // Sort Code format: 00-00-00
            break;
        case 'EUR': 
            generatedCode = "FR76" + rand(14).toString(); // Sample IBAN format
            break;

        // Asia & East Asia
        case 'JPY': case 'KRW': case 'CNY': case 'HKD': case 'TWD': case 'MOP': case 'SGD': case 'MYR': case 'THB': case 'IDR': case 'VND': case 'PKR': case 'BDT': case 'LKR': case 'NPR': 
            generatedCode = rand(12).toString(); 
            break;
        case 'PHP': 
            generatedCode = "0" + rand(10).toString(); // 11-digit BRSTN/Account
            break;
        case 'INR': 
            generatedCode = "ABCD0" + rand(6).toString(); // IFSC format (4 letters, 0, 6 digits)
            break;

        // Oceania & Other
        case 'AUD': 
            generatedCode = `${rand(3)}-${rand(3)}`; // BSB Format: 000-000
            break;
        case 'NZD': 
            generatedCode = `${rand(6)}-${rand(7)}`; // Bank/Branch/Account format
            break;

        default: 
            generatedCode = rand(10).toString();
    }
    
    routingInput.value = generatedCode;
    
    // Visual feedback
    routingInput.classList.add('bg-blue-50', 'border-blue-400');
    setTimeout(() => { routingInput.classList.remove('bg-blue-50', 'border-blue-400'); }, 800);
}

function generatePassword(userId) {
    const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
    let retVal = "";
    for (let i = 0; i < 12; ++i) {
        retVal += charset.charAt(Math.floor(Math.random() * charset.length));
    }
    const passInput = document.getElementById(`pass-${userId}`);
    passInput.value = retVal;
    
    // Visual feedback
    passInput.classList.add('ring-2', 'ring-amber-400');
    setTimeout(() => passInput.classList.remove('ring-2', 'ring-amber-400'), 1000);
}
